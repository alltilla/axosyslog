name: Compile dbld-images

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'dbld/**'
      - 'packaging/rhel/**'
      - 'packaging/debian/**'
      - '.github/workflows/dbld-images.yml'
  push:
    paths:
      - 'dbld/**'
      - 'packaging/rhel/**'
      - 'packaging/debian/**'
      - '.github/workflows/dbld-images.yml'
  schedule:
    - cron: '00 22 * * *'
  workflow_dispatch:
    inputs:
      testing_image_upload:
        description: Should we upload the images into GitHub Packages? (true/false)
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      container-registry: ${{ steps.registry.outputs.container-registry }}
      upload: ${{ steps.upload.outputs.upload }}
    steps:
      - name: Set container registry
        id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          CONTAINER_REGISTRY="ghcr.io/${REPOSITORY_OWNER}"
          CONTAINER_REGISTRY="$(echo "$CONTAINER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          echo "container-registry=${CONTAINER_REGISTRY}" >> "${GITHUB_OUTPUT}"

      - name: Should we upload the images?
        id: upload
        env:
          TESTING_IMAGE_UPLOAD: ${{ github.event.inputs.testing_image_upload }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${TESTING_IMAGE_UPLOAD}" = "true" ] || \
             ( \
              [ "${REPOSITORY_OWNER}" = "axoflow" ] && \
              [ "${GITHUB_REF}" = "refs/heads/main" ] && \
              [[ "${EVENT_NAME}" =~ ^(push|workflow_dispatch|schedule)$ ]] \
            )
          then
            echo "upload=true" >> "${GITHUB_OUTPUT}"
          else
            echo "upload=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read  # checkout source
      packages: write  # push dbld images to GHCR
    env:
      CONTAINER_REGISTRY: ${{ needs.prepare.outputs.container-registry }}
    strategy:
      matrix:
        image:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - fedora-44
          - debian-bullseye
          - debian-bookworm
          - debian-sid
          - debian-trixie
          - ubuntu-focal
          - ubuntu-jammy
          - ubuntu-noble
          - ubuntu-plucky
          - ubuntu-questing
          - ubuntu-resolute
        arch:
          - amd64
        include:
          # image-devshell builds debian-testing and tarball first, so every layer of
          # the chain bases on the image built in this job, not on the registry's
          # previous :latest
          - image: devshell
            arch: amd64
          - image: devshell
            arch: arm64
      fail-fast: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Build the images
        env:
          IMAGE: ${{ matrix.image }}
        run: dbld/rules image-${IMAGE}

      - name: Log in to the Container registry
        if: needs.prepare.outputs.upload == 'true'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        if: needs.prepare.outputs.upload == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "${IMAGE}" in
            devshell) images="debian-testing tarball devshell" ;;
            *) images="${IMAGE}" ;;
          esac
          for image in ${images}; do
            dbld/rules "push-image-${image}" IMAGE_ARCH="${ARCH}"
          done

  publish:
    name: Publish
    needs: [prepare, build]
    # a failed build must not hold back the other images' :latest, -k merges what was pushed
    if: ${{ !cancelled() && needs.prepare.outputs.upload == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout source
      packages: write  # push the manifest lists to GHCR
    env:
      CONTAINER_REGISTRY: ${{ needs.prepare.outputs.container-registry }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the architecture tags into :latest
        run: dbld/rules -k merge-images
